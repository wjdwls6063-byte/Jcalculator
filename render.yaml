services:
  - type: web
    name: jcalculator-engine-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JCALCULATOR_ALLOWED_ORIGINS
        value: https://jcalculator.onrender.com
      - key: JCALCULATOR_API_KEYS
        sync: false

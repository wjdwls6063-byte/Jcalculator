<body>
<dialog class="auth-dialog" id="adminLogin"><div class="dialog-head"><h2>관리자 모드</h2><button class="icon-button" id="closeLogin" aria-label="닫기">✕</button></div><div class="auth-card"><p>관리자로 로그인하면 일정과 할 일을 편집할 수 있습니다.</p><form id="loginForm"><label class="field">관리자 ID<input name="username" autocomplete="username" required value="admin"></label><label class="field">비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">편집 모드로 들어가기</button><span class="auth-error" id="authError" role="alert"></span></form></div></dialog>
<div class="shell guest-mode" id="appShell">
  <header class="top"><a class="brand" href="../" title="도구 모음으로 돌아가기"><span class="brand-mark">00</span> 일정관리</a><div class="top-actions"><span class="sync-status" id="syncStatus">서버 연결 중</span><button class="button ghost-dark" id="backupBtn" title="데이터 백업">백업</button><button class="button ghost-dark" id="restoreBtn" title="백업 파일 복원">복원</button><button class="button ghost-dark" id="modeBtn">관리자 모드</button></div></header>
  <nav class="tabs" id="tabs" aria-label="프로젝트 선택"></nav>
  <div class="sync-banner hidden" id="syncBanner"></div>
  <main class="compact-layout">
    <aside class="compact-sidebar" aria-label="달력과 마감 임박 일정">
      <section class="compact-calendar"><div class="calendar-top"><h2 id="monthTitle"></h2><div class="inline-actions"><button class="icon-button" id="prevMonth" aria-label="이전 달">‹</button><button class="icon-button" id="todayMonth">오늘</button><button class="icon-button" id="nextMonth" aria-label="다음 달">›</button></div></div><div class="calendar-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar-grid" id="calendar"></div><div class="calendar-legend" id="legend"></div><div class="day-selection" id="daySelection"></div></section>
      <section class="compact-alerts"><h2>마감 임박</h2><div id="urgent"></div></section>
    </aside>
    <section class="compact-content" aria-label="프로젝트 일정과 할 일">
      <div class="compact-heading"><h2>주요 일정</h2><div class="summary" id="summary"></div><button class="button primary" id="addEventBtn">+ 일정 추가</button></div>
      <div class="schedule-table-wrap"><div class="schedule-table-head"><span>날짜</span><span>프로젝트</span><span>상위 일정</span><span>할 일 진행</span><span>마감</span><span>관리</span></div><div id="milestones"></div></div>
      <div class="compact-heading secondary-heading"><h2>할 일 목록</h2><span class="section-note">연결된 일정과 별도 할 일 · 끌어서 순서 변경</span><button class="button" id="addTaskBtn">+ 할 일</button></div>
      <div class="unlinked" id="unlinked"></div>
      <section class="shared-board" aria-label="공유 메모와 체크리스트">
        <div class="compact-heading secondary-heading"><h2>공유 메모 · 체크리스트</h2><span class="shared-board-help">게스트도 작성·체크 가능 · 모든 기기에 공유</span></div>
        <form id="sharedNoteForm" class="shared-note-form"><select name="projectId" aria-label="메모 프로젝트" required></select><select name="kind" aria-label="항목 종류"><option value="memo">메모</option><option value="checklist">체크리스트</option></select><textarea name="body" aria-label="메모 또는 할 일 내용" maxlength="500" rows="1" placeholder="메모 또는 체크할 내용을 입력하세요" required></textarea><button class="button primary" type="submit">등록</button></form>
        <div class="shared-note-toolbar"><strong id="sharedNoteCount">체크리스트 0/0 완료 · 미완료 0</strong><span class="shared-note-progress" aria-hidden="true"><i id="sharedNoteProgress"></i></span><div class="shared-note-filters" id="sharedNoteFilters" role="group" aria-label="공유 항목 보기"></div></div>
        <div id="sharedNotes" class="shared-note-list"></div>
      </section>
    </section>
  </main>
  <p style="max-width:1584px;margin:0 auto;padding:0 22px 25px;color:#73849a;font-size:12px">일정은 서버 데이터베이스에 저장됩니다. 중요한 내용은 백업 파일도 내려받아 보관하세요.</p>
</div>
<dialog id="editor"><div class="dialog-head"><h2 id="editorTitle"></h2><button class="icon-button" id="closeEditor" aria-label="닫기">✕</button></div><form id="editorForm" class="form-body"></form></dialog>
<input id="restoreInput" type="file" accept="application/json,.json" class="hidden">

<script>
(()=>{'use strict';
const KEY='jcalculator.schedule.v1';
const DRAFT_KEY='jcalculator.schedule.unsynced.v1',MIGRATED_KEY='jcalculator.schedule.migrated.v1';
const COLORS=['#1769d6','#16a06a','#8b55cf','#df8737','#d34c68','#168d9f'];
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const pad=n=>String(n).padStart(2,'0');
const localDate=(date=new Date())=>`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
const parseDate=s=>new Date(`${s}T12:00:00`);
const dayDiff=s=>Math.round((parseDate(s)-parseDate(localDate()))/86400000);
const dLabel=s=>{const n=dayDiff(s);return n<0?`D+${-n}`:n===0?'D-Day':`D-${n}`};
const dClass=s=>{const n=dayDiff(s);return n<0?'late':n===0?'today-due':n<=3?'soon':''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=s=>{const d=parseDate(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`};
const shortDate=s=>{const d=parseDate(s);return `${d.getMonth()+1}.${pad(d.getDate())}`};
const priorityRank={high:0,normal:1,low:2};
const priorityLabel={high:'높음',normal:'보통',low:'낮음'};
let data=emptyData(),sharedNotes=[],noteFilter='all',scope='all',month=new Date(),selectedDate='',dragId='';
const holidayCache=new Map(),holidayLoading=new Set(),holidayErrors=new Set(),expandedEvents=new Set();
let serverVersion=0,csrfToken='',role='',pending=false,syncing=false,syncBlocked=false,syncErrorStatus=0,importingLegacy=false,serverEmpty=false;
month.setDate(1);
function emptyData(){return{version:1,projects:[],events:[],tasks:[]}}
function validData(x){return x&&Array.isArray(x.projects)&&Array.isArray(x.events)&&Array.isArray(x.tasks)}
function stored(key){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function hasItems(x){return validData(x)&&(x.projects.length||x.events.length||x.tasks.length)}
async function api(path,options={}){let response;try{response=await fetch(path,{credentials:'same-origin',cache:'no-store',...options})}catch{throw Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.')}const body=await response.json().catch(()=>({}));if(!response.ok){const error=Error(typeof body.detail==='string'?body.detail:`서버 오류 (${response.status})`);error.status=response.status;throw error}return body}
function setStatus(message){$('syncStatus').textContent=message}

function bindTaskControls(root){root.querySelectorAll('[data-check-task]').forEach(c=>c.onchange=()=>{const t=data.tasks.find(t=>t.id===c.dataset.checkTask);if(!t)return;if(c.checked&&data.tasks.some(child=>child.parentId===t.id&&!child.done)){c.checked=false;toast('미완료 하위 할 일을 먼저 완료해 주세요.');return}t.done=c.checked;save()});root.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>openEditor('task',b.dataset.editTask))}
function bindDrag(){if(role!=='admin')return;document.querySelectorAll('[data-task-row]').forEach(row=>{row.ondragstart=e=>{dragId=row.dataset.taskRow;row.classList.add('dragging');e.dataTransfer.effectAllowed='move'};row.ondragend=()=>row.classList.remove('dragging');row.ondragover=e=>{if(dragId)e.preventDefault()};row.ondrop=e=>{e.preventDefault();const src=data.tasks.find(t=>t.id===dragId),dst=data.tasks.find(t=>t.id===row.dataset.taskRow);if(!src||!dst||src.id===dst.id||src.eventId!==dst.eventId||src.projectId!==dst.projectId||(src.parentId||'')!==(dst.parentId||''))return;const group=data.tasks.filter(t=>t.projectId===src.projectId&&t.eventId===src.eventId&&(t.parentId||'')===(src.parentId||'')).sort((a,b)=>(a.order||0)-(b.order||0));const from=group.findIndex(t=>t.id===src.id),to=group.findIndex(t=>t.id===dst.id);group.splice(to,0,group.splice(from,1)[0]);group.forEach((t,i)=>t.order=i+1);save()}})}
function alertItems(){return [...events().filter(e=>!e.done).map(e=>({...e,kind:'event',due:e.date})),...tasks().filter(t=>!t.done&&t.due).map(t=>({...t,kind:'task'}))].filter(x=>dayDiff(x.due)<=7).sort((a,b)=>a.due.localeCompare(b.due)||priorityRank[a.priority||'normal']-priorityRank[b.priority||'normal'])}
function renderUrgent(){const list=alertItems();$('urgent').innerHTML=list.length?list.slice(0,10).map(x=>`<div class="urgent-row"><span class="badge ${dClass(x.due)}">${esc(dLabel(x.due))}</span>${x.kind==='task'?`<input class="task-check" type="checkbox" data-check-task="${esc(x.id)}" aria-label="${esc(x.title)} 완료">`:''}<div class="urgent-main"><div class="urgent-title">${esc(x.title)}</div><div class="urgent-meta"><span class="urgent-project" style="--project-color:${esc(color(x.projectId))}">${esc(project(x.projectId)?.name||'프로젝트')}</span> · ${esc(x.kind==='task'?taskContext(x):'주요 일정')} · <strong class="urgent-date">${esc(dateLabel(x.due))}</strong></div></div></div>`).join(''):`<div class="empty">7일 내 마감 또는 지연된 항목이 없습니다.</div>`;bindTaskControls($('urgent'))}
async function loadSharedNotes(){const result=await api('/api/schedule/notes');sharedNotes=Array.isArray(result.notes)?result.notes:[];renderSharedNotes()}
function renderSharedNotes(){
  const form=$('sharedNoteForm'),select=form.elements.projectId,previous=select.value;
  select.innerHTML=data.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  select.value=scope!=='all'?scope:(data.projects.some(p=>p.id===previous)?previous:data.projects[0]?.id||'');
  form.querySelectorAll('textarea,select,button').forEach(control=>control.disabled=!data.projects.length);
  const scoped=sharedNotes.filter(note=>project(note.projectId)&&(scope==='all'||note.projectId===scope));
  const checklist=scoped.filter(note=>note.kind==='checklist'),done=checklist.filter(note=>note.done).length,open=checklist.length-done;
  $('sharedNoteCount').textContent=`체크리스트 ${done}/${checklist.length} 완료 · 미완료 ${open}`;
  $('sharedNoteProgress').style.width=`${checklist.length?Math.round(done/checklist.length*100):0}%`;
  $('sharedNoteFilters').innerHTML=[['all',`전체 ${scoped.length}`],['open',`미완료 ${open}`],['done',`완료 ${done}`]].map(([key,label])=>`<button type="button" class="filter-chip ${noteFilter===key?'active':''}" data-note-filter="${key}" aria-pressed="${noteFilter===key}">${label}</button>`).join('');
  $('sharedNoteFilters').querySelectorAll('[data-note-filter]').forEach(button=>button.onclick=()=>{noteFilter=button.dataset.noteFilter;renderSharedNotes()});
  const visible=scoped.filter(note=>noteFilter==='all'||(note.kind==='checklist'&&(noteFilter==='done'?note.done:!note.done))).sort((a,b)=>(a.kind==='checklist'&&!a.done?0:a.kind==='memo'?1:2)-(b.kind==='checklist'&&!b.done?0:b.kind==='memo'?1:2)||b.createdAt.localeCompare(a.createdAt));
  $('sharedNotes').innerHTML=visible.length?visible.map(note=>`<div class="shared-note-row ${note.done?'done':''}">${note.kind==='checklist'?`<label class="shared-note-toggle"><input type="checkbox" data-note-check="${esc(note.id)}" aria-label="${esc(note.body)} 완료" ${note.done?'checked':''}><span class="shared-note-body">${esc(note.body)}</span></label><span class="shared-note-status ${note.done?'complete':'incomplete'}">${note.done?'완료':'미완료'}</span>`:`<span class="shared-note-type">메모</span><span class="shared-note-body">${esc(note.body)}</span>`}<span class="shared-note-project" style="--project-color:${esc(color(note.projectId))}">${esc(project(note.projectId)?.name||'프로젝트')}</span>${role==='admin'?`<button class="icon-button" type="button" data-note-delete="${esc(note.id)}" aria-label="공유 항목 삭제">✕</button>`:''}</div>`).join(''):`<div class="empty shared-note-empty">${!data.projects.length?'프로젝트를 추가하면 공유 메모를 작성할 수 있습니다.':scoped.length?'이 보기에는 항목이 없습니다.':'공유 메모가 없습니다. 위에서 첫 항목을 등록하세요.'}</div>`;
  $('sharedNotes').querySelectorAll('[data-note-check]').forEach(box=>box.onchange=()=>checkSharedNote(box));
  $('sharedNotes').querySelectorAll('[data-note-delete]').forEach(button=>button.onclick=()=>deleteSharedNote(button.dataset.noteDelete));
}
async function addSharedNote(e){
  e.preventDefault();const form=e.currentTarget,button=form.querySelector('button[type=submit]'),f=new FormData(form),body=String(f.get('body')||'').trim();if(!body)return;
  button.disabled=true;
  try{const note=await api('/api/schedule/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId:String(f.get('projectId')),kind:String(f.get('kind')),body})});sharedNotes.unshift(note);noteFilter='all';form.elements.body.value='';renderSharedNotes();toast('공유 항목을 저장했습니다.')}
  catch(error){toast(error.message)}finally{button.disabled=false}
}
async function checkSharedNote(box){const note=sharedNotes.find(item=>item.id===box.dataset.noteCheck);if(!note)return;box.disabled=true;try{const updated=await api(`/api/schedule/notes/${encodeURIComponent(note.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:box.checked})});Object.assign(note,updated);renderSharedNotes()}catch(error){toast(error.message);renderSharedNotes()}}
async function deleteSharedNote(id){if(role!=='admin'||!confirm('이 공유 항목을 삭제할까요?'))return;try{await api(`/api/schedule/notes/${encodeURIComponent(id)}`,{method:'DELETE',headers:{'X-CSRF-Token':csrfToken}});sharedNotes=sharedNotes.filter(note=>note.id!==id);renderSharedNotes()}catch(error){toast(error.message)}}
function optionProjects(selected){return data.projects.map(p=>`<option value="${esc(p.id)}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
function optionEvents(projectId,selected){return `<option value="">연결하지 않음</option>`+data.events.filter(e=>e.projectId===projectId).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<option value="${esc(e.id)}" ${selected===e.id?'selected':''}>${esc(dateLabel(e.date))} · ${esc(e.title)}</option>`).join('')}
function optionParents(projectId,selected,excludeId){return `<option value="">상위 할 일 없음</option>`+data.tasks.filter(t=>t.projectId===projectId&&!t.eventId&&!t.parentId&&t.id!==excludeId).map(t=>`<option value="${esc(t.id)}" ${selected===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}
function openEditor(kind,id=null,eventId=null,presetDate='',presetParentId=''){
  if(role!=='admin')return;
  if(kind!=='project'&&!data.projects.length){toast('먼저 프로젝트를 추가해 주세요.');openEditor('project');return}
  const obj=kind==='project'?project(id):kind==='event'?event(id):data.tasks.find(t=>t.id===id);
  const currentProject=obj?.projectId||event(eventId)?.projectId||data.tasks.find(t=>t.id===presetParentId)?.projectId||(scope!=='all'?scope:data.projects[0]?.id);
  $('editorTitle').textContent=`${id?'수정':'추가'} · ${kind==='project'?'프로젝트':kind==='event'?'주요 일정':'할 일'}`;
  const form=$('editorForm');form.dataset.kind=kind;form.dataset.id=id||'';
  form.innerHTML=kind==='project'?`<label class="field">프로젝트 이름<input name="name" required maxlength="40" value="${esc(obj?.name||'')}" placeholder="예: 프로젝트 A"></label><label class="field">구분 색상<input name="color" type="color" value="${esc(obj?.color||COLORS[data.projects.length%COLORS.length])}"></label>`:
    kind==='event'?`<label class="field">프로젝트<select name="projectId" required>${optionProjects(currentProject)}</select></label><label class="field">일정 이름<input name="title" required maxlength="80" value="${esc(obj?.title||'')}" placeholder="예: 고객 미팅, 설계 검수"></label><div class="two-fields"><label class="field">날짜<input name="date" type="date" required value="${esc(obj?.date||presetDate||localDate())}"></label><label class="field">시간<input name="time" type="time" value="${esc(obj?.time||'')}"></label></div><label class="field">메모<textarea name="notes" maxlength="500" placeholder="장소나 준비사항">${esc(obj?.notes||'')}</textarea></label>`:
    `<label class="field">프로젝트<select name="projectId" required id="formProject">${optionProjects(currentProject)}</select></label><label class="field">연결할 주요 일정<select name="eventId" id="formEvent">${optionEvents(currentProject,obj?.eventId??eventId??'')}</select></label><label class="field" id="parentField">상위 할 일<select name="parentId" id="formParent">${optionParents(currentProject,obj?.parentId||presetParentId,id)}</select></label><label class="field">할 일<input name="title" required maxlength="100" value="${esc(obj?.title||'')}" placeholder="예: 수정사항 반영"></label><div class="two-fields"><label class="field">마감일<input name="due" type="date" value="${esc(obj?.due||presetDate||'')}"></label><label class="field">중요도<select name="priority"><option value="high" ${obj?.priority==='high'?'selected':''}>높음</option><option value="normal" ${!obj||obj.priority==='normal'?'selected':''}>보통</option><option value="low" ${obj?.priority==='low'?'selected':''}>낮음</option></select></label></div>`;
  form.innerHTML+=`<div class="form-actions">${id?'<button type="button" class="button danger" id="deleteItem">삭제</button>':''}<button type="button" class="button" id="cancelEditor">취소</button><button type="submit" class="button primary">저장</button></div>`;
  form.onsubmit=submitEditor;form.querySelector('#cancelEditor').onclick=()=>$('editor').close();if(id)form.querySelector('#deleteItem').onclick=()=>deleteItem(kind,id);
  if(kind==='task'){
    const refresh=()=>{const linked=!!$('formEvent').value;$('parentField').classList.toggle('hidden',linked);if(linked)$('formParent').value=''};
    $('formProject').onchange=e=>{$('formEvent').innerHTML=optionEvents(e.target.value,'');$('formParent').innerHTML=optionParents(e.target.value,'',id);refresh()};
    $('formEvent').onchange=refresh;refresh();
  }
  $('editor').showModal();form.querySelector('input:not([type=color]),select')?.focus();
}
function submitEditor(e){
  e.preventDefault();const form=e.currentTarget,kind=form.dataset.kind,id=form.dataset.id,f=new FormData(form);
  if(kind==='project'){
    const name=String(f.get('name')).trim();if(!name)return;
    const obj={id:id||uid(),name,color:String(f.get('color'))};if(id)Object.assign(project(id),obj);else data.projects.push(obj);scope=obj.id;
  }else if(kind==='event'){
    const title=String(f.get('title')).trim();if(!title)return;
    const obj={id:id||uid(),projectId:String(f.get('projectId')),title,date:String(f.get('date')),time:String(f.get('time')),notes:String(f.get('notes')).trim(),done:event(id)?.done||false};
    if(id){Object.assign(event(id),obj);data.tasks.filter(t=>t.eventId===id).forEach(t=>t.projectId=obj.projectId)}else data.events.push(obj);
  }else{
    const title=String(f.get('title')).trim();if(!title)return;
    const projectId=String(f.get('projectId')),eventId=String(f.get('eventId')),parentId=eventId?'':String(f.get('parentId')||'');
    const parent=parentId?data.tasks.find(t=>t.id===parentId):null;
    if(parentId&&(!parent||parent.projectId!==projectId||parent.eventId||parent.parentId||parent.id===id)){toast('같은 프로젝트의 상위 할 일을 선택해 주세요.');return}
    const old=id?data.tasks.find(t=>t.id===id):null;
    if(old&&data.tasks.some(t=>t.parentId===id)&&(projectId!==old.projectId||eventId||parentId)){toast('하위 할 일이 있는 상위 할 일은 이동할 수 없습니다.');return}
    const group=data.tasks.filter(t=>t.projectId===projectId&&t.eventId===eventId&&(t.parentId||'')===parentId);
    const obj={id:id||uid(),projectId,eventId,parentId,title,due:String(f.get('due')),priority:String(f.get('priority')),order:group.length+1,done:old?.done||false};
    if(old){if(old.eventId===eventId&&old.projectId===projectId&&(old.parentId||'')===parentId)obj.order=old.order;Object.assign(old,obj)}else data.tasks.push(obj);
    if(parent&&parent.done)parent.done=false;
  }
  $('editor').close();save();
}
function deleteItem(kind,id){
  const message=kind==='project'?'프로젝트와 포함된 일정·할 일을 모두 삭제할까요?':kind==='event'?'이 일정을 삭제할까요? 연결된 할 일은 별도 할 일로 남습니다.':'이 할 일을 삭제할까요? 하위 할 일은 별도 할 일로 남습니다.';
  if(!confirm(message))return;
  if(kind==='project'){data.projects=data.projects.filter(x=>x.id!==id);data.events=data.events.filter(x=>x.projectId!==id);data.tasks=data.tasks.filter(x=>x.projectId!==id);scope='all'}
  else if(kind==='event'){data.events=data.events.filter(x=>x.id!==id);data.tasks.forEach(t=>{if(t.eventId===id)t.eventId=''})}
  else{data.tasks=data.tasks.filter(x=>x.id!==id);data.tasks.forEach(t=>{if(t.parentId===id)t.parentId=''})}
  $('editor').close();save();
}
function downloadData(content){const blob=new Blob([JSON.stringify(content,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`00-일정관리-백업-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function downloadBackup(){downloadData(data)}
async function restoreBackup(file){try{if(file.size>5*1024*1024)throw Error('5MB 이하 파일만 복원할 수 있습니다.');const x=JSON.parse(await file.text());if(!validData(x))throw Error('올바른 백업 파일이 아닙니다.');if(!confirm('서버의 모든 일정 데이터를 백업 파일 내용으로 교체할까요? 현재 내용은 먼저 백업해 주세요.'))return;data={version:1,projects:x.projects,events:x.events,tasks:x.tasks};scope='all';selectedDate='';save()}catch(e){toast(e.message||'복원에 실패했습니다.')}finally{$('restoreInput').value=''}}
function bind(){ $('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);selectedDate='';renderCalendar()};$('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);selectedDate='';renderCalendar()};$('todayMonth').onclick=()=>{month=new Date();month.setDate(1);selectedDate='';renderCalendar()};$('addEventBtn').onclick=()=>openEditor('event');$('addTaskBtn').onclick=()=>openEditor('task');$('sharedNoteForm').onsubmit=addSharedNote;$('backupBtn').onclick=downloadBackup;$('restoreBtn').onclick=()=>$('restoreInput').click();$('restoreInput').onchange=e=>{if(e.target.files[0])restoreBackup(e.target.files[0])};$('closeEditor').onclick=()=>$('editor').close();$('modeBtn').onclick=()=>role==='admin'?logout():enterAdmin();$('closeLogin').onclick=()=>$('adminLogin').close()}
async function enterAdmin(){try{const session=await api('/api/schedule/session');if(session.role==='admin'){role='admin';csrfToken=session.csrfToken;setStatus('서버에 저장됨');showApp();return}}catch(error){if(error.status!==401){toast(error.message);return}}showLogin()}
async function login(event){event.preventDefault();const form=event.currentTarget,submit=form.querySelector('button[type=submit]');submit.disabled=true;$('authError').textContent='로그인 중…';try{const f=new FormData(form),session=await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:String(f.get('username')),password:String(f.get('password'))})});role='admin';csrfToken=session.csrfToken;form.querySelector('[name=password]').value='';await loadServer();$('adminLogin').close()}catch(error){role='guest';csrfToken='';$('authError').textContent=error.message}finally{submit.disabled=false}}
async function logout(){if(pending||syncBlocked){if(!confirm('서버에 저장되지 않은 내용이 있습니다. 백업 후 편집 모드를 종료하시겠습니까?'))return}try{await api('/api/admin/logout',{method:'POST',headers:{'X-CSRF-Token':csrfToken}})}catch(error){if(error.status!==401){toast(error.message);return}}role='guest';csrfToken='';try{await loadServer()}catch(error){setStatus('서버 연결 실패');showApp();toast(error.message)}}
bind();$('loginForm').onsubmit=login;document.addEventListener('click',e=>{if(e.target.closest('.summary-detail'))return;document.querySelectorAll('.summary-detail.open').forEach(detail=>{detail.classList.remove('open');detail.querySelector('.summary-trigger').setAttribute('aria-expanded','false')})});init();
})();
</script>
